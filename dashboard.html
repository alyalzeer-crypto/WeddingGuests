<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>لوحة إدارة المعازيم</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- الشريط العلوي -->
        <div class="top-bar">

            <div>
                <h1>إدارة معازيم الحفل</h1>

                <p id="userEmail">
                    جاري تحميل بيانات المستخدم...
                </p>
            </div>

            <button
                id="logoutBtn"
                class="logout-btn"
            >
                تسجيل الخروج
            </button>

        </div>


        <!-- الإحصائيات -->
        <div class="stats">

            <div class="card">
                <h3>إجمالي المدعوين</h3>
                <p id="totalGuests">0</p>
            </div>

            <div class="card">
                <h3>تمت دعوتهم</h3>
                <p id="invitedGuests">0</p>
            </div>

            <div class="card">
                <h3>لم تتم دعوتهم</h3>
                <p id="notInvitedGuests">0</p>
            </div>

        </div>


        <!-- إضافة مدعو -->
        <div class="add-guest">

            <h2>إضافة مدعو جديد</h2>

            <input
                type="text"
                id="guestName"
                placeholder="اسم المدعو"
            >

            <input
                type="number"
                id="guestCount"
                placeholder="عدد الأشخاص"
                min="1"
                value="1"
            >

            <select id="guestStatus">

                <option value="not-invited">
                    لم تتم دعوته
                </option>

                <option value="invited">
                    تمت دعوته
                </option>

            </select>

            <button id="addGuestBtn">
                إضافة المدعو
            </button>

        </div>


        <!-- قائمة المدعوين -->
        <div class="guest-list">

            <h2>قائمة المدعوين</h2>

            <input
                type="text"
                id="searchGuest"
                placeholder="ابحث عن مدعو..."
            >

            <div id="guestsContainer">
            </div>

        </div>

    </div>


    <!-- الرسائل المنبثقة -->
    <div
        id="toast"
        class="toast"
    ></div>


    <!-- نافذة تعديل الاسم -->
    <div
        id="editNameModal"
        class="modal-overlay"
    >

        <div class="custom-modal">

            <h2>تعديل اسم المدعو</h2>

            <p>
                أدخل الاسم الصحيح للمدعو
            </p>

            <input
                type="text"
                id="editGuestNameInput"
                placeholder="اسم المدعو"
            >

            <div class="modal-actions">

                <button
                    id="saveGuestNameBtn"
                    class="modal-save-btn"
                >
                    حفظ التعديل
                </button>

                <button
                    id="cancelEditNameBtn"
                    class="modal-cancel-btn"
                >
                    إلغاء
                </button>

            </div>

        </div>

    </div>


    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>

    <script src="app.js"></script>

</body>

</html>
