<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>قائمة المدعوين | إدارة المعازيم</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="app-page">

        <!-- رأس الصفحة -->
        <header class="mobile-header">

            <div>
                <h1>قائمة المدعوين</h1>

                <p id="currentUserInfo">
                    جاري التحميل...
                </p>
            </div>

        </header>


        <!-- البحث والفلاتر -->
        <section class="guest-toolbar">

            <!-- البحث -->
            <input
                type="text"
                id="searchGuest"
                class="search-input"
                placeholder="ابحث عن مدعو..."
                autocomplete="off"
            >


            <!-- فلتر حالة الدعوة -->
            <div class="filter-section">

                <p class="filter-label">
                    حالة الدعوة
                </p>

                <div class="filter-tabs">

                    <button
                        class="filter-btn status-filter active"
                        data-filter="all"
                    >
                        الجميع
                    </button>

                    <button
                        class="filter-btn status-filter"
                        data-filter="invited"
                    >
                        تمت دعوتهم
                    </button>

                    <button
                        class="filter-btn status-filter"
                        data-filter="not-invited"
                    >
                        لم تتم دعوتهم
                    </button>

                </div>

            </div>


            <!-- فلتر الجنس -->
            <div class="filter-section gender-filter-section">

                <p class="filter-label">
                    الجنس
                </p>

                <div class="gender-filter-tabs">

                    <button
                        class="gender-filter-btn active"
                        data-gender="all"
                    >
                        الجميع
                    </button>

                    <button
                        class="gender-filter-btn"
                        data-gender="male"
                    >
                        الرجال
                    </button>

                    <button
                        class="gender-filter-btn"
                        data-gender="female"
                    >
                        النساء
                    </button>

                    <button
                        class="gender-filter-btn"
                        data-gender="unknown"
                    >
                        غير محدد
                    </button>

                </div>

            </div>

        </section>


        <!-- عنوان القائمة -->
        <section class="list-status">

            <div>

                <h2 id="listTitle">
                    جميع المدعوين
                </h2>

                <p id="listCount">
                    0 مدعو
                </p>

            </div>

        </section>


        <!-- قائمة المدعوين -->
        <section id="guestsContainer">
        </section>

    </main>


    <!-- =========================================
         نافذة تعديل الاسم
    ========================================== -->

    <div
        id="editNameModal"
        class="modal-overlay"
    >

        <div class="custom-modal">

            <h2>
                تعديل اسم المدعو
            </h2>

            <p>
                أدخل الاسم الصحيح للمدعو
            </p>

            <input
                type="text"
                id="editGuestNameInput"
                placeholder="اسم المدعو"
            >

            <div class="modal-actions">

                <button
                    id="saveGuestNameBtn"
                    class="modal-save-btn"
                >
                    حفظ التعديل
                </button>

                <button
                    id="cancelEditNameBtn"
                    class="modal-cancel-btn"
                >
                    إلغاء
                </button>

            </div>

        </div>

    </div>


    <!-- =========================================
         نافذة اختيار الجنس
    ========================================== -->

    <div
        id="genderModal"
        class="modal-overlay"
    >

        <div class="custom-modal gender-modal">

            <h2>
                تحديد الجنس
            </h2>

            <p id="genderGuestName">
                اختر جنس المدعو
            </p>


            <div class="gender-choice-grid">

                <button
                    id="setMaleBtn"
                    class="gender-choice-btn male-choice"
                >
                    👨
                    <span>
                        ذكر
                    </span>
                </button>


                <button
                    id="setFemaleBtn"
                    class="gender-choice-btn female-choice"
                >
                    👩
                    <span>
                        أنثى
                    </span>
                </button>

            </div>


            <button
                id="clearGenderBtn"
                class="clear-gender-btn"
            >
                جعله غير محدد
            </button>


            <button
                id="cancelGenderBtn"
                class="modal-cancel-btn gender-cancel-btn"
            >
                إلغاء
            </button>

        </div>

    </div>


    <!-- الرسائل -->
    <div
        id="toast"
        class="toast"
    ></div>


    <!-- التنقل السفلي -->
    <nav class="bottom-nav">

        <a
            href="home.html"
            class="bottom-nav-item"
        >
            <span class="nav-icon">
                🏠
            </span>

            <span>
                الرئيسية
            </span>
        </a>


        <a
            href="add.html"
            class="bottom-nav-item"
        >
            <span class="nav-icon">
                ＋
            </span>

            <span>
                إضافة
            </span>
        </a>


        <a
            href="guests.html"
            class="bottom-nav-item active"
        >
            <span class="nav-icon">
                👥
            </span>

            <span>
                المدعوون
            </span>
        </a>


        <a
            href="account.html"
            class="bottom-nav-item"
        >
            <span class="nav-icon">
                👤
            </span>

            <span>
                حسابي
            </span>
        </a>

    </nav>


    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>

    <script src="supabase.js"></script>

    <script src="common.js"></script>

    <script src="guests.js"></script>

</body>

</html>
